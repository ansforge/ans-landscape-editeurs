name: Vérifier les liens

# Contrôle hebdomadaire des liens sortants de data/*.yml.
# Limite connue : esante.gouv.fr répond 200 même pour une page inexistante, un lien erroné
# sur ce domaine n'est donc pas détecté. Les autres domaines (industriels, interop, gnius) le sont.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-links
