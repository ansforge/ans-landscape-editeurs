name: Valider

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Valider les données (schémas et cohérence)
        run: npm run validate
      - name: Tests du questionnaire
        run: npm test
      - name: Construire le site
        run: npm run build
