# Catalogue des briques du portail (une entrée par service).
# Source de vérité : le site et les pages de service sont générés depuis ce fichier.
# Schéma : schemas/services.schema.json
#
# `validated: false` signale une fiche à relire par le référent (bandeau affiché sur le site).
# Principe : on renvoie vers la source officielle, on ne recopie pas son contenu.

- id: prosante-connect
  name: Pro Santé Connect
  theme: identite
  summary: Authentifier un professionnel de santé avec OpenID Connect.
  audience: [editeur, integrateur, developpeur]
  use_when: Votre logiciel donne accès à des données ou à des actions réservées à un professionnel de santé.
  owner: Référent du portail
  validated: false
  updated: 2026-10-20
  links:
    documentation: https://industriels.esante.gouv.fr/produits-et-services/pro-sante-connect
    specification: https://esante.gouv.fr/ens/offre/pro-sante-connect/documentation-technique
    sandbox: https://esante.gouv.fr/ens/offre/pro-sante-connect/documentation-technique
    test_data: https://industriels.esante.gouv.fr/produits-et-services/pro-sante-connect
    support: https://industriels.esante.gouv.fr/
  sandbox:
    summary: Bac à sable (BAS) avec les points d'accès de découverte, d'autorisation, de jeton, UserInfo, de déconnexion et d'introspection.
    access: Demande de raccordement au bac à sable depuis l'Espace Authentifié des industriels, délai moyen d'environ deux semaines.
    limits: À préciser par le référent.
  prerequisites:
    security: À préciser par le référent.
    compliance: Un test réussi sur le bac à sable est exigé avant tout accès à la production.
    referencing: Raccordement à Pro Santé Connect via l'Espace Authentifié des industriels.
  related: [e-cps, si-coeur]

