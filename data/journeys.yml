# Version publique filtrée - 2026-10-21
# Ne contient ni donnée personnelle, ni coordonnée individuelle, ni information d’infrastructure interne, ni secret.
# Les informations non confirmées restent explicitement marquées comme telles.
steps:
- id: comprendre
  title: Comprendre l’écosystème
  objective: Situer votre solution dans l’écosystème du numérique en santé et identifier les cadres applicables.
  actions:
  - Consulter la Doctrine du numérique en santé.
  - Repérer les référentiels et services socles utiles à votre solution.
  standards:
  - doctrine
- id: regles
  title: Identifier les règles applicables
  objective: Déterminer les exigences de sécurité, de conformité et d’hébergement applicables.
  actions:
  - Qualifier les données traitées et les usages prévus.
  - Consulter la PGSSI-S et les référentiels associés.
  - Vérifier si le recours à un hébergeur certifié HDS est requis.
  themes:
  - securite
  standards:
  - referentiel-identification
- id: socles
  title: Choisir les services socles
  objective: Identifier les services d’identité, d’interopérabilité, de données et de test à intégrer.
  actions:
  - Sélectionner les services correspondant aux cas d’usage.
  - Consulter les prérequis et la documentation officielle de chaque service.
  themes:
  - identite
  - interop
  - donnees
  - tests
- id: specifications
  title: Accéder aux spécifications et aux API
  objective: Utiliser les spécifications et guides d’implémentation publiés par leurs propriétaires.
  actions:
  - Ouvrir la documentation officielle de chaque service retenu.
  - Vérifier la version et le statut publiés par la source officielle.
  themes:
  - identite
  - interop
  - donnees
- id: developper
  title: Développer
  objective: Intégrer les services retenus dans votre solution.
  actions:
  - Respecter les spécifications officielles.
  - Ne pas utiliser de données réelles dans les environnements de développement ou de démonstration.
  - Prévoir la gestion sécurisée des secrets et des journaux applicatifs.
- id: tester
  title: Tester dans les environnements prévus
  objective: Valider l’intégration avec des identités et des données de test.
  actions:
  - Demander l’accès aux environnements de test disponibles.
  - Utiliser uniquement des identités et jeux de données fictifs ou explicitement autorisés.
  - Tester les scénarios fonctionnels et de sécurité.
  needs: sandbox
- id: conformite
  title: Vérifier la conformité
  objective: Contrôler le respect des exigences applicables avant la mise en production.
  actions:
  - Reprendre les prérequis officiels de chaque service.
  - Constituer les justificatifs nécessaires.
  - Vérifier les obligations RGPD et de sécurité avant publication.
  standards:
  - homologation
  themes:
  - securite
- id: referencement
  title: Préparer le référencement ou l’homologation
  objective: Identifier la démarche et le guichet adaptés au produit.
  actions:
  - Consulter G_NIUS et les pages officielles du service concerné.
  - Constituer le dossier demandé par le guichet compétent.
  standards:
  - gnius
  flag: referencement
- id: production
  title: Passer en production
  objective: Ouvrir le service aux utilisateurs dans un cadre maîtrisé.
  actions:
  - Vérifier les autorisations et prérequis de production.
  - Mettre en place le suivi des incidents et des changements.
  - Contrôler qu’aucune donnée interne, personnelle ou secrète n’est exposée publiquement.
- id: evolutions
  title: Suivre les évolutions
  objective: Maintenir l’intégration et la conformité dans le temps.
  actions:
  - Consulter les sources officielles.
  - Planifier les migrations lorsqu’une version change de statut.
  - Faire valider toute information de roadmap avant publication.
questions:
- id: q1
  label: Quel type de solution développez-vous ?
  options:
  - id: logiciel-pro
    label: Un logiciel pour des professionnels ou des établissements de santé
  - id: service-usager
    label: Un service ou une application pour les usagers
  - id: service-donnees
    label: Une plateforme ou un service d’échange de données
  - id: nsp
    label: Je ne sais pas
    hint: Nous vous présenterons les cas les plus courants.
- id: q2
  label: À quels utilisateurs votre solution est-elle destinée ?
  options:
  - id: pro
    label: Professionnels de santé
  - id: usager
    label: Usagers ou patients
  - id: both
    label: Les deux
  - id: nsp
    label: Je ne sais pas
    hint: Nous vous présenterons les deux cas.
- id: q3
  label: Votre solution traite-t-elle des données de santé à caractère personnel ?
  options:
  - id: oui
    label: Oui
  - id: non
    label: Non
  - id: nsp
    label: Je ne sais pas
- id: q4
  label: Devez-vous authentifier un professionnel ?
  options:
  - id: oui
    label: Oui
  - id: non
    label: Non
  - id: nsp
    label: Je ne sais pas
- id: q5
  label: Votre solution échange-t-elle des données avec d’autres systèmes d’information ?
  options:
  - id: oui
    label: Oui
  - id: non
    label: Non
  - id: nsp
    label: Je ne sais pas
- id: q6
  label: Votre produit est-il concerné par une démarche de référencement ou d’homologation ?
  options:
  - id: oui
    label: Oui
  - id: non
    label: Non
  - id: nsp
    label: Je ne sais pas
